<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DarkMoji</title>
<style>
  @font-face { font-family:"Misaki"; src:url("fonts/misaki_gothic.woff2") format("woff2"); }
  :root { --bg:#000; --fg:#e8e8e8; --dim:#8a8a8a; --accent:#5cf; --line:#262626; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-tap-highlight-color: transparent; }
  #setup { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:28px; letter-spacing:.08em; margin:8px 0 4px; }
  .sub { color:var(--dim); font-size:14px; margin:0 0 24px; }
  label { display:block; font-size:13px; color:var(--dim); margin:18px 0 6px; }
  input[type=text] { width:100%; font:inherit; font-size:22px; padding:12px; color:var(--fg);
    background:#0b0b0b; border:1px solid var(--line); border-radius:8px; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  select, input[type=number] { width:100%; font:inherit; font-size:18px; padding:12px; color:var(--fg);
    background:#0b0b0b; border:1px solid var(--line); border-radius:8px; }
  #periodRow[hidden] { display:none; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--fg); margin:16px 0 0; }
  #preview { display:block; width:100%; height:auto; margin-top:12px; background:#050505;
    border:1px solid var(--line); border-radius:8px; image-rendering:pixelated; }
  .btns { display:flex; gap:10px; margin-top:24px; }
  button { font:inherit; font-size:16px; padding:14px 16px; border-radius:10px; border:1px solid var(--line);
    background:#111; color:var(--fg); cursor:pointer; }
  button.primary { flex:1; background:var(--accent); color:#001018; border-color:var(--accent); font-weight:700; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .help { color:var(--dim); font-size:13px; line-height:1.7; margin-top:28px; }
  #stage { position:fixed; inset:0; background:#000; display:none; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #cv { position:absolute; inset:0; width:100%; height:100%; }
  #status { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 12px);
    text-align:center; font-size:13px; color:#555; pointer-events:none; padding:0 16px; }
  #menu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(0,0,0,.88); }
  #menu[hidden] { display:none; }
  #menu p { margin:0 0 8px; font-size:20px; color:var(--fg); }
  #menu button { flex:none; width:min(260px, 70vw); }
</style>
</head>
<body>

<main id="setup">
  <h1>DarkMoji</h1>
  <p class="sub" data-i18n="sub"></p>

  <label for="text" data-i18n="labelText"></label>
  <input id="text" type="text" maxlength="20" autocomplete="off">
  <canvas id="preview" data-i18n-aria="previewAlt"></canvas>

  <label for="colw"><span class="row"><span data-i18n="labelColw"></span><span id="colwVal">24</span></span></label>
  <input id="colw" type="range" min="4" max="120" value="24">

  <label for="hpct"><span class="row"><span data-i18n="labelHpct"></span><span id="hpctVal">100</span></span></label>
  <input id="hpct" type="range" min="20" max="100" value="100">

  <label for="mode" data-i18n="labelMode"></label>
  <select id="mode">
    <option value="accel" data-i18n="modeAccel"></option>
    <option value="fixed" data-i18n="modeFixed"></option>
  </select>
  <div id="periodRow" hidden>
    <label for="period" data-i18n="labelPeriod"></label>
    <input id="period" type="number" min="0.3" max="10" step="0.1" value="1.5" inputmode="decimal">
  </div>

  <label class="check"><input id="flip" type="checkbox"> <span data-i18n="flip"></span></label>

  <div class="btns">
    <button id="start" class="primary" data-i18n="start"></button>
    <button id="demo" data-i18n="demo"></button>
  </div>

  <p class="help" data-i18n-html="help"></p>
</main>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="status"></div>
  <div id="menu" hidden>
    <p id="menuTitle" data-i18n="paused"></p>
    <button id="resume" class="primary" data-i18n="resume"></button>
    <button id="toText" data-i18n="toText"></button>
  </div>
</div>

<script>
"use strict";
const ROWS = 8;                  // 美咲フォントは 8x8
const U0 = 0.2, U1 = 0.8;        // 片道のうち、前20%は非表示・中央60%で全文字・後20%は非表示
const IDLE_MS = 3000;            // 検出できる振りがこれだけ途切れたら停止中にする
const MIN_THR = 2.0;             // m/s² これ未満は振りとみなさない

const $ = id => document.getElementById(id);
const setup = $("setup"), stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
const textEl = $("text"), colwEl = $("colw"), hpctEl = $("hpct"), flipEl = $("flip"), statusEl = $("status");

// ---------- 表示言語（日本語以外は英語） ----------
const LANG = (navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en";
const T = {
  ja: {
    sub: "スマホを振って、暗闇に文字を浮かべる",
    labelText: "表示する文字（20文字まで）", previewAlt: "ドット表示のプレビュー",
    labelColw: "光らせる幅（px）", labelHpct: "全体の高さ（画面の%）",
    flip: "左右を反転する（文字が逆に見えるとき）",
    labelMode: "動作モード", modeAccel: "加速度で自動（往復を計測）", modeFixed: "周期を指定（行きだけ表示）",
    labelPeriod: "往復の周期（秒）",
    fixedHint: p => `周期 ${p} 秒（往復）。行きだけ表示します。短くタップで行きの開始に合わせます`,
    start: "スタート", demo: "PCデモ",
    help: "画面を縦向きに持ち、横方向に何度も振ってください。画面を長押し（約1秒）すると、この画面に戻ります。<br>" +
          "1往復目は周期と加速度の計測、2振り目以降で表示します。行きも帰りも表示し、帰りは列を逆順に光らせます。<br>" +
          "光らせる幅を広げると明るくなりますが、文字はにじみます。<br>" +
          "「周期を指定」では加速度を使わず、決めた周期（例: 1.5秒で1往復）で行きだけ表示します。振りに合わなければ短くタップして位相を合わせます。<br>" +
          "センサーはHTTPSのページでのみ動きます（周期指定を除く）。",
    defaultText: "こんばんは",
    measure: "振ってください（1往復で計測／長押しで戻る）", measuring: n => `計測中… ${n}/3`,
    paused: "停止中", resume: "再開", toText: "文字入力",
    noSensor: "センサーの値が来ません。HTTPSで開いているか確認してください（PCは「PCデモ」）",
    permDenied: "モーションセンサーの許可が必要です", sensorErr: m => "センサーを開始できません: " + m,
  },
  en: {
    sub: "Shake your phone to write words in the dark",
    labelText: "Text to display (up to 20 characters)", previewAlt: "Dot preview",
    labelColw: "Lit width (px)", labelHpct: "Overall height (% of screen)",
    flip: "Mirror left/right (if the text looks reversed)",
    labelMode: "Mode", modeAccel: "Auto (measure acceleration)", modeFixed: "Fixed period (outward stroke only)",
    labelPeriod: "Round-trip period (s)",
    fixedHint: p => `Period ${p} s per round trip. Only the outward stroke is shown. Tap briefly to sync the start of a stroke.`,
    start: "Start", demo: "PC demo",
    help: "Hold the phone upright and shake it sideways, back and forth. Long-press the screen (about 1 s) to return here.<br>" +
          "The first round trip measures the period and acceleration; the text appears from the second swing on. It shows on both the outward and return strokes, lighting the columns in reverse on the return.<br>" +
          "A wider lit width is brighter but blurs the text.<br>" +
          "\"Fixed period\" does not use the sensors: it shows the text on the outward stroke only, at the period you set (e.g. 1.5 s per round trip). Tap briefly to sync the phase to your swing.<br>" +
          "Motion sensors only work on HTTPS pages (not needed for fixed period).",
    defaultText: "Hello",
    measure: "Shake the phone (one round trip to calibrate / long-press to go back)", measuring: n => `Measuring… ${n}/3`,
    paused: "Paused", resume: "Resume", toText: "Edit text",
    noSensor: "No sensor data. Check that the page is opened over HTTPS (use \"PC demo\" on a computer).",
    permDenied: "Motion sensor permission is required", sensorErr: m => "Cannot start the sensor: " + m,
  },
}[LANG];
document.documentElement.lang = LANG;
document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });
document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = T[el.dataset.i18nHtml]; });
document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", T[el.dataset.i18nAria]); });
textEl.value = T.defaultText;

// ---------- 文字 → ドットビットマップ ----------
let bits = [], N = 0;            // bits[col][row]

async function buildBitmap(str) {
  const S = 8;                   // 8倍で描いて各ドットの中心をサンプルする（半端な座標でも欠けない）
  const font = `${ROWS * S}px "Misaki"`;
  try { await document.fonts.load(font, str || "あ"); } catch (_) {}
  const meas = document.createElement("canvas").getContext("2d");
  meas.font = font;
  const w = Math.max(1, Math.round(meas.measureText(str).width / S));
  const PAD = 2;
  const c = document.createElement("canvas");
  c.width = (w + PAD * 2) * S; c.height = ROWS * S;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.font = font; g.fillStyle = "#fff"; g.textBaseline = "alphabetic";
  g.fillText(str, PAD * S, (ROWS - 1) * S);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const out = [];
  for (let x = 0; x < w + PAD * 2; x++) {
    const col = new Array(ROWS);
    for (let y = 0; y < ROWS; y++) {
      const px = x * S + S / 2, py = y * S + S / 2;
      col[y] = d[(py * c.width + px) * 4 + 3] > 128;
    }
    out.push(col);
  }
  return out;
}

const pv = $("preview"), pg = pv.getContext("2d");
async function refreshPreview() {
  bits = await buildBitmap(textEl.value.trim());
  N = bits.length;
  const s = 10;
  pv.width = N * s; pv.height = ROWS * s;
  pg.fillStyle = "#050505"; pg.fillRect(0, 0, pv.width, pv.height);
  pg.fillStyle = "#7df";
  for (let x = 0; x < N; x++) for (let y = 0; y < ROWS; y++)
    if (bits[x][y]) pg.fillRect(x * s, y * s, s - 1, s - 1);
}
textEl.addEventListener("input", refreshPreview);
colwEl.addEventListener("input", () => { $("colwVal").textContent = colwEl.value; });
hpctEl.addEventListener("input", () => { $("hpctVal").textContent = hpctEl.value; });
document.fonts.ready.then(refreshPreview);
refreshPreview();

// ---------- 振りの検出 ----------
// 加速度のローブ（同符号の山）のピーク = 折り返し地点。+ピーク → その後 +方向へ進む。
let state = "idle";              // idle | measure | run
let af = 0, env = 0, lastT = 0, lobe = { sign: 0, max: 0, t: 0 }, lastFired = 0;
let peaks = [], model = null, lastPeakT = 0, calibratedAt = 0;

function resetMeasure() {
  state = "measure"; peaks = []; model = null; lobe.sign = 0; lastFired = 0; env = 0;
  statusEl.textContent = T.measure;
}

function pause() {
  state = "paused"; statusEl.textContent = ""; $("menu").hidden = false;
}

function resume() {
  $("menu").hidden = true; lastT = 0; af = 0;
  resetMeasure();
}

function onAccel(t, a) {
  if (state === "idle" || state === "paused") return;
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
  lastT = t;
  af += 0.5 * (a - af);
  const m = Math.abs(af), s = Math.sign(af);
  env = Math.max(m, env * Math.exp(-dt / 1.5));
  const thr = Math.max(MIN_THR, env * 0.5);

  if (lobe.sign === 0) {
    if (m > thr && s !== lastFired) lobe = { sign: s, max: m, t };
  } else {
    if (s === lobe.sign && m > lobe.max) { lobe.max = m; lobe.t = t; }
    if (s !== lobe.sign || m < lobe.max * 0.6) {
      firePeak(lobe.t, lobe.sign, lobe.max);
      lastFired = lobe.sign;
      lobe.sign = 0;
    }
  }
}

function firePeak(t, sign, amp) {
  if (state === "measure") {
    const prev = peaks[peaks.length - 1];
    if (prev && (prev.sign === sign || t - prev.t < 80)) peaks = [];
    peaks.push({ t, sign, amp });
    statusEl.textContent = T.measuring(Math.min(peaks.length, 3));
    if (peaks.length === 3) {
      const Th = (peaks[2].t - peaks[0].t) / 2;
      if (Th < 80 || Th > 1500) { peaks.shift(); return; }
      const amp = (peaks[0].amp + peaks[1].amp + peaks[2].amp) / 3;
      model = { tRef: peaks[2].t, dirRef: peaks[2].sign, Th, amp, prevT: peaks[2].t };
      lastPeakT = t; calibratedAt = performance.now(); state = "run";
    }
    return;
  }
  if (state !== "run") return;
  // 折り返しを検出するたびに、直近の半周期と加速度を重く取り入れて更新する
  const W = 0.6;
  const k = Math.round((t - model.prevT) / model.Th);
  if (k >= 1) {
    const th = (t - model.prevT) / k;
    if (th > model.Th * 0.5 && th < model.Th * 2) model.Th = (1 - W) * model.Th + W * th;
  }
  model.amp = (1 - W) * model.amp + W * amp;
  model.tRef = t; model.dirRef = sign;               // 位相は最新の折り返しに合わせる
  model.prevT = t; lastPeakT = t;
}

// ---------- センサー入力 ----------
let gx = null, gotMotion = false;
function onMotion(e) {
  const t = performance.now();
  let ax;
  if (e.acceleration && e.acceleration.x != null) ax = e.acceleration.x;
  else {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    gx = gx == null ? g.x : gx + 0.02 * (g.x - gx);
    ax = g.x - gx;
  }
  gotMotion = true;
  onAccel(t, ax);
}

// PC用デモ：周期0.6秒の往復を合成
let simTimer = null;
function startSim() {
  const t0 = performance.now(), w = 2 * Math.PI / 600;
  simTimer = setInterval(() => {
    const t = performance.now();
    onAccel(t, 12 * Math.cos(w * (t - t0)) + (Math.random() - 0.5) * 1.5);
  }, 16);
}

// ---------- 描画 ----------
let raf = 0, wakeLock = null, fix = null;

function fit() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// u: 1ストローク内の進み(0..1)。表示区間外は -1、それ以外は左端から数えた列番号
function columnAt(u, dir) {
  if (u < U0 || u > U1) return -1;
  let c = Math.floor((u - U0) / (U1 - U0) * N);                      // 時間に比例して全列を並べる
  c = Math.max(0, Math.min(N - 1, c));
  return dir < 0 ? N - 1 - c : c;                                    // 帰りは逆順
}

function lightColumn(c) {
  const rowH = innerHeight * hpctEl.value / 100 / ROWS, colW = +colwEl.value, y0 = (innerHeight - rowH * ROWS) / 2;
  ctx.fillStyle = "#fff";
  const col = bits[c], x0 = innerWidth / 2 - colW / 2;
  for (let r = 0; r < ROWS; r++)
    if (col[r]) ctx.fillRect(x0, y0 + r * rowH, colW, rowH - 2);
}

function draw(now) {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  if (state === "fixed") {                                           // 周期指定：行き（前半）だけ表示
    if (now - calibratedAt > 5000 && statusEl.textContent) statusEl.textContent = "";
    const x = (((now - fix.tRef) / fix.P) % 1 + 1) % 1;
    if (x >= 0.5) return;
    const c = columnAt(x * 2, flipEl.checked ? -1 : 1);
    if (c >= 0) lightColumn(c);
    return;
  }
  if (state !== "run") return;
  if (now - lastPeakT > IDLE_MS) { pause(); return; }               // 弱い・周期的でない状態が続いたらメニューを出す
  if (now - calibratedAt > 4000 && statusEl.textContent) statusEl.textContent = "";

  const x = (now - model.tRef) / model.Th, n = Math.floor(x);
  let dir = model.dirRef * (((n % 2) + 2) % 2 === 0 ? 1 : -1);
  if (flipEl.checked) dir = -dir;
  const c = columnAt(x - n, dir);
  if (c >= 0) lightColumn(c);
}

function loop(now) { draw(now); raf = requestAnimationFrame(loop); }

// ---------- 画面遷移 ----------
async function begin(demo) {
  const fixed = $("mode").value === "fixed";
  if (fixed) demo = false;
  try {
    if (!fixed && !demo && typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { alert(T.permDenied); return; }
    }
  } catch (err) { alert(T.sensorErr(err.message)); return; }

  await refreshPreview();
  // iPhoneは入力欄に編集履歴があると、振ったときに「取り消す」が出る。履歴を消して入力欄を無効にする
  textEl.blur(); textEl.value = textEl.value; textEl.disabled = true;
  setup.style.display = "none"; stage.style.display = "block";
  fit(); gotMotion = false; gx = null; lastT = 0; af = 0;
  if (fixed) {
    const P = Math.min(10, Math.max(0.3, parseFloat($("period").value) || 1.5));
    fix = { tRef: performance.now(), P: P * 1000 };
    state = "fixed"; calibratedAt = performance.now(); statusEl.textContent = T.fixedHint(P);
    raf = requestAnimationFrame(loop);
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
    return;
  }
  resetMeasure();
  if (demo) startSim(); else window.addEventListener("devicemotion", onMotion);
  raf = requestAnimationFrame(loop);
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
  if (!demo) setTimeout(() => {
    if (state !== "idle" && !gotMotion)
      statusEl.textContent = T.noSensor;
  }, 1500);
}

function end() {
  state = "idle"; $("menu").hidden = true; cancelAnimationFrame(raf);
  window.removeEventListener("devicemotion", onMotion);
  clearInterval(simTimer); simTimer = null;
  try { wakeLock?.release(); } catch (_) {}
  textEl.disabled = false;
  stage.style.display = "none"; setup.style.display = "block";
}

$("start").addEventListener("click", () => begin(false));
$("demo").addEventListener("click", () => begin(true));
$("resume").addEventListener("click", resume);
$("toText").addEventListener("click", end);
// 長押し（0.8秒）で文字入力に戻る
let holdTimer = 0;
const cancelHold = () => { clearTimeout(holdTimer); holdTimer = 0; };
let downAt = 0;
stage.addEventListener("pointerdown", () => { downAt = performance.now(); cancelHold(); holdTimer = setTimeout(() => { holdTimer = 0; end(); }, 800); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => stage.addEventListener(ev, cancelHold));
stage.addEventListener("pointerup", e => {                          // 周期指定：短いタップで行きの開始に位相を合わせる
  if (state === "fixed" && e.target === cv && performance.now() - downAt < 300) fix.tRef = performance.now();
});
$("mode").addEventListener("change", () => { $("periodRow").hidden = $("mode").value !== "fixed"; });
stage.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("resize", () => { if (state !== "idle") fit(); });

// 動作確認用
window.__darkmoji = { get state() { return state; }, get model() { return model; }, get bits() { return bits; } };
</script>
</body>
</html>
